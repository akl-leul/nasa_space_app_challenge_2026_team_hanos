name: CI

# Deployment is not done here: Vercel builds the website and Render builds the API image, each from the main branch
# (docs/DEPLOYMENT.md). This workflow is the gate that tells you a change is sound before it is merged.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Website (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    name: Science API (offline tests, image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pip install -r services/api/requirements-dev.txt
      # tests marked "live" talk to the real archives and are not run in CI
      - run: python -m pytest services/api/tests -q -m "not live"
        env:
          PYTHONPATH: .
          HANOS_CACHE_DIR: ${{ runner.temp }}/hanos-cache
      - name: Build the API image (not pushed)
        run: docker build -f services/api/Dockerfile -t hanos-api:ci .
